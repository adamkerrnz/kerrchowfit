<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>12-Week Training Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="toolbar">
    <button type="button" onclick="window.print()">Print / save as PDF</button>
  </div>

  <main class="stage">
    <div class="sheet">
      <img class="sheet-bg" src="background.svg" alt="" aria-hidden="true">

      <div class="sheet-content">
        <header class="masthead">
          <div>
            <div class="eyebrow" id="eyebrow"></div>
            <h1 class="display display--lg" id="title"></h1>
          </div>
          <div class="legend">
            <div class="legend-types" id="legend-types"></div>
            <div class="legend-effort" id="legend-effort"></div>
          </div>
        </header>

        <div class="phases" id="phases" aria-label="Training phases"></div>
        <div class="week" id="week" aria-label="Weekly schedule"></div>
        <div class="strength" id="strength"></div>
        <div class="notes" id="notes"></div>
      </div>
    </div>
  </main>

  <script src="plan.js"></script>
  <script src="render.js"></script>
</body>
</html>
