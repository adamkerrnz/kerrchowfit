# KerrChow Fit, self-hosted. Deploy as a Portainer stack (see DOCKER.md) or with `docker compose up -d --build`.
# Values come from the stack's environment variables (Portainer) or a .env file next to this one.
services:
  kerrchowfit:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: kerrchowfit:local
    container_name: kerrchowfit
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8088}:8000"
    environment:
      TZ: ${TZ:-Pacific/Auckland}
      # Login for the whole site (strongly recommended: this is health data)
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      # The address you open the app at, e.g. http://192.168.1.50:8088 (used for the Strava sign-in redirect)
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Strava API app from https://www.strava.com/settings/api
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REFRESH_TOKEN: ${STRAVA_REFRESH_TOKEN:-}
      # Garmin Connect sign-in (only needed until tokens are saved to the volume)
      GARMIN_EMAIL: ${GARMIN_EMAIL:-}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD:-}
      GARMIN_REFRESH_TIME: ${GARMIN_REFRESH_TIME:-05:45}
      # Forecast location (default: Auckland Central)
      WEATHER_LAT: ${WEATHER_LAT:--36.8485}
      WEATHER_LON: ${WEATHER_LON:-174.7633}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - kerrchowfit-data:/data

volumes:
  kerrchowfit-data:
