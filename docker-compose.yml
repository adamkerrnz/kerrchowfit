# KerrChow Fit, self-hosted. Deploy as a Portainer stack (see DOCKER.md) or with `docker compose up -d --build`.
# Values come from the stack's environment variables (Portainer) or a .env file next to this one.
services:
  kerrchowfit:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: kerrchowfit:local
    container_name: kerrchowfit
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8088}:8000"
    environment:
      TZ: ${TZ:-Pacific/Auckland}
      # Login for the whole site. Required: without it the server refuses every request (this is health data).
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      # Only if you really want no login, on a network nobody else can reach
      ALLOW_NO_LOGIN: ${ALLOW_NO_LOGIN:-false}
      # The address you open the app at, e.g. http://192.168.1.50:8088 (used for the Strava sign-in redirect)
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Optional: Strava API app and Garmin Personal API key (both can be entered on the Stats tab instead)
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REFRESH_TOKEN: ${STRAVA_REFRESH_TOKEN:-}
      GARMIN_PERSONAL_API_KEY: ${GARMIN_PERSONAL_API_KEY:-}
      # Daily refresh (weather, classes, Garmin, Strava); empty turns it off, e.g. when host cron runs `python -m app.daily`
      DAILY_REFRESH_TIME: ${DAILY_REFRESH_TIME-05:40}
      # Forecast location (default: Auckland Central)
      WEATHER_LAT: ${WEATHER_LAT:--36.8485}
      WEATHER_LON: ${WEATHER_LON:-174.7633}
      # Les Mills club for the morning class details (01 = Auckland City; empty turns the daily check off)
      LESMILLS_CLUB: ${LESMILLS_CLUB-01}
      LESMILLS_TIME: ${LESMILLS_TIME:-07:10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - kerrchowfit-data:/data

volumes:
  kerrchowfit-data:
